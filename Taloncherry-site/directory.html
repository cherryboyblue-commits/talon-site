<body class="directory-page font-sans-custom antialiased">
    <a class="site-crest-seal" href="index.html" title="The Talon Cherry Seal">
        <img src="Images/crest-emblem.png?v=cut" alt="The Talon Cherry Seal" width="96" height="128">
    </a>

    <header class="parlor-bar" aria-label="The Parlor">
        <nav class="parlor-bar-links">
            <a class="parlor-bar-link" data-parlor-nav="board" href="forum.html">The Board</a>
            <a class="parlor-bar-link" data-parlor-nav="directory" href="directory.html">Members Directory</a>
            <a class="parlor-bar-link" data-parlor-nav="ledger" id="parlor-nav-ledger" href="member.html">Your Ledger</a>
        </nav>
        <div class="parlor-bar-user">
            <span class="parlor-member-chip">
                <img id="member-avatar" class="parlor-member-face is-empty" alt="">
                <span id="member-label" class="parlor-member"></span>
            </span>
            <button type="button" id="sign-out" class="parlor-signout">Sign out</button>
        </div>
    </header>

    <p id="gate-msg" class="relative z-10 text-center font-serif-custom italic py-24" style="color:#ead6ad;">Checking the guest book…</p>

    <main id="directory-main" class="directory-wrap" hidden>
        <section class="directory-book">
            <p class="directory-kicker">The Parlor</p>
            <h1 class="directory-title">Members Directory</h1>
            <p class="directory-blurb">The house roll. Open a ledger to read what a member has bound.</p>
            <div class="directory-tools">
                <label class="directory-search">
                    <span class="directory-search-label">Look for a member</span>
                    <input class="parlor-field" id="directory-query" type="search" maxlength="80" placeholder="Name or a word from their bio…" autocomplete="off">
                </label>
                <div class="directory-sort" role="group" aria-label="Sort the roll">
                    <button type="button" class="directory-sort-btn is-active" id="directory-sort-name" aria-pressed="true">By name</button>
                    <button type="button" class="directory-sort-btn" id="directory-sort-recent" aria-pressed="false">Most recent</button>
                </div>
            </div>
            <p id="directory-error" class="directory-error" hidden></p>
            <div id="directory-grid" class="directory-grid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="site-foot border-t border-zinc-900/80">
